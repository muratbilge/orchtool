[workspace]
members = ["crates/orch-proto", "crates/orchd", "crates/orch", "crates/orch-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
orch-proto = { path = "crates/orch-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
vt100 = "0.18.1"
portable-pty = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
base64 = "0.22"
libc = "0.2"
anyhow = "1"
