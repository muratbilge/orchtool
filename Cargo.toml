[workspace]
members = ["crates/orch-proto", "crates/orchd", "crates/orch", "crates/orch-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
orch-proto = { path = "crates/orch-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
vt100 = "0.18.1"
